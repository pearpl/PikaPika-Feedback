name: Card Recognition Issue
description: Report an incorrect or missing card detection.
title: '[Recognition] '
labels:
- scanner
- bug
body:
- type: markdown
  attributes:
    value: Please search existing reports first. Describe what you see in the app;
      no technical diagnosis is needed. Reports and attachments are visible to everyone.
      Remove personal information, account details, and private collection data before
      posting. Never share passwords or access keys. For security concerns, use the
      confidential reporting link in SECURITY.md.
- type: dropdown
  id: platform
  attributes:
    label: Platform
    options:
    - iOS
    - Android
  validations:
    required: true
- type: input
  id: game
  attributes:
    label: Game / card type
  validations:
    required: true
- type: input
  id: set
  attributes:
    label: Card set
  validations:
    required: false
- type: input
  id: card
  attributes:
    label: Card name
  validations:
    required: true
- type: input
  id: number
  attributes:
    label: Card number if known
  validations:
    required: false
- type: input
  id: language
  attributes:
    label: Language
  validations:
    required: true
- type: dropdown
  id: variant
  attributes:
    label: Card variant
    options:
    - Normal
    - Holo
    - Reverse Holo
    - Other
  validations:
    required: true
- type: input
  id: app-version
  attributes:
    label: App version
  validations:
    required: true
- type: input
  id: device
  attributes:
    label: Device model
  validations:
    required: true
- type: textarea
  id: problem
  attributes:
    label: Description of recognition problem
    description: For Other, specify the card variant here.
  validations:
    required: true
- type: textarea
  id: expected
  attributes:
    label: Expected detected card
  validations:
    required: true
- type: textarea
  id: actual
  attributes:
    label: Actual detected result
  validations:
    required: true
- type: textarea
  id: photo
  attributes:
    label: Photo or screenshot if possible
    description: Do not upload images containing personal or sensitive information.
      Crop or redact before attaching.
  validations:
    required: false
