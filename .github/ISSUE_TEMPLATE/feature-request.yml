name: Feature Request
description: Suggest a concrete improvement to PikaPika.
title: '[Feature] '
labels:
- feature
body:
- type: markdown
  attributes:
    value: Please search existing reports first. Describe what you see in the app;
      no technical diagnosis is needed. Reports and attachments are visible to everyone.
      Remove personal information, account details, and private collection data before
      posting. Never share passwords or access keys. For security concerns, use the
      confidential reporting link in SECURITY.md.
- type: dropdown
  id: platform
  attributes:
    label: Platform
    options:
    - iOS
    - Android
  validations:
    required: true
- type: textarea
  id: feature
  attributes:
    label: Feature description
  validations:
    required: true
- type: textarea
  id: problem
  attributes:
    label: Problem this feature would solve
  validations:
    required: true
- type: textarea
  id: solution
  attributes:
    label: Proposed solution
    description: Describe how you would like the app to work. Technical implementation
      details are not needed.
  validations:
    required: true
- type: textarea
  id: alternatives
  attributes:
    label: Alternative solutions considered
  validations:
    required: false
- type: textarea
  id: context
  attributes:
    label: Additional context
  validations:
    required: false
